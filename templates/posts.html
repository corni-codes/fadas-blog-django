<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{posts.title}} — Fada's Blog</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f3;
            color: #171717;
        }

        /* HEADER */
        .header {
            max-width: 1000px;
            margin: auto;
            padding: 30px 25px;
            border-bottom: 1px solid #d8d8d5;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        /* ARTICLE */
        .article {
            max-width: 850px;
            margin: auto;
            padding: 45px 25px 80px;
        }

        /* BACK BUTTON */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            text-decoration: none;
            color: #555;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 60px;

            transition: color 0.2s ease,
                        transform 0.2s ease;
        }

        .back:hover {
            color: #000;
            transform: translateX(-4px);
        }

        /* ARTICLE HEADER */
        .date {
            color: #888;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .article h1 {
            font-size: clamp(40px, 7vw, 72px);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 35px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #d8d8d5;
            margin-bottom: 40px;
        }

        /* ARTICLE BODY */
        .content {
            max-width: 720px;
            font-size: 18px;
            line-height: 1.9;
            color: #333;
        }

        .content p {
            margin-bottom: 25px;
        }

        /* FOOTER */
        .article-footer {
            margin-top: 70px;
            padding-top: 25px;
            border-top: 1px solid #d8d8d5;

            color: #888;
            font-size: 13px;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .header {
                padding: 25px 18px;
            }

            .article {
                padding: 35px 18px 60px;
            }

            .back {
                margin-bottom: 45px;
            }

            .article h1 {
                letter-spacing: -2px;
            }

            .content {
                font-size: 17px;
                line-height: 1.8;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">
            Fada's Blog
        </div>
    </header>


    <main class="article">

        <!-- BACK TO HOME -->
        <a href="/" class="back">
            ← Back to Blog
        </a>


        <!-- ARTICLE HEADER -->

        <div class="date">
            {{posts.created_at}}
        </div>

        <h1>
            {{posts.title}}
        </h1>

        <div class="divider"></div>


        <!-- FULL POST -->

        <div class="content">
            {{posts.body}}
        </div>


        <div class="article-footer">
            © Fada's Blog
        </div>

    </main>

</body>
</html>
